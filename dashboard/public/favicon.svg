<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />

  <!-- Headset arch -->
  <path d="M17 32C17 23.7157 23.7157 17 32 17C40.2843 17 47 23.7157 47 32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Ear cushions -->
  <rect x="13" y="28" width="6" height="12" rx="3" fill="url(#favCyan)" />
  <rect x="45" y="28" width="6" height="12" rx="3" fill="url(#favCyan)" />

  <!-- Central Bot / Support Face with Eyes -->
  <rect x="23" y="25" width="18" height="15" rx="5" fill="#ffffff" />
  <!-- Eyes -->
  <circle cx="28" cy="32" r="2" fill="#4f46e5" />
  <circle cx="36" cy="32" r="2" fill="#4f46e5" />

  <!-- Microphone boom -->
  <path d="M46 36C46 42 41 46 36 46H33" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="32" cy="46" r="2.5" fill="url(#favCyan)" />

  <!-- Sparkle top right -->
  <path d="M51 10L52.5 14L56.5 15.5L52.5 17L51 21L49.5 17L45.5 15.5L49.5 14L51 10Z" fill="#38bdf8" />
