<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container with rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner subtle border for polished depth -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Support Headset & AI Bot Graphic -->
  <g filter="url(#glow)">
    <!-- Headset headband arch -->
    <path d="M19 33C19 25.82 24.82 20 32 20C39.18 20 45 25.82 45 33" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Left earphone cushion -->
    <rect x="16" y="30" width="5" height="11" rx="2.5" fill="url(#accentGrad)" />
    <!-- Right earphone cushion -->
    <rect x="43" y="30" width="5" height="11" rx="2.5" fill="url(#accentGrad)" />

    <!-- Chat / AI Message bubble center -->
    <path d="M25 29C25 26.24 28.13 24 32 24C35.87 24 39 26.24 39 29C39 31.76 35.87 34 32 34C30.82 34 29.71 33.79 28.75 33.41L26 35V32.48C25.38 31.5 25 30.3 25 29Z" fill="#ffffff" />

    <!-- Headset Microphone Boom -->
    <path d="M44 38C44 42.5 39 45 35 45H34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="33" cy="45" r="2" fill="url(#accentGrad)" />

    <!-- AI Sparkle Icon at upper right -->
    <path d="M47 14L48.2 17.8L52 19L48.2 20.2L47 24L45.8 20.2L42 19L45.8 17.8L47 14Z" fill="#38bdf8" />
  </g>
</svg>
